<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Abrindo link...</title></head><body><p id="status">Abrindo o endereço...</p><script>
(async function(){const el=document.getElementById('status');const id=new URLSearchParams(location.search).get('id');if(!/^([1-9]|[1-4][0-9]|50)$/.test(id||'')){el.textContent='QR Code inválido.';return}try{const response=await fetch('../destinos.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Arquivo de destinos indisponível');const dados=await response.json(),url=dados[id]?.url;if(!url){el.textContent='Este QR Code ainda não tem um destino configurado.';return}const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw Error('Destino inválido');location.replace(parsed.href)}catch(e){el.textContent='Não foi possível abrir o destino. Tente novamente mais tarde.'}})();
</script></body></html>
